<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js via CDN; sets chartUnavailable flag if the script fails to load -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"
    onerror="window.chartUnavailable = true"
  ></script>
</head>
<body>

  <!-- ── Storage warning banner (shown when localStorage is unavailable) ── -->
  <div id="storage-warning" role="alert" aria-live="polite" hidden>
    ⚠️ Local storage is unavailable. Your transactions will not be saved between sessions.
  </div>

  <!-- ── Chart error banner (shown when Chart.js CDN fails to load) ── -->
  <div id="chart-error-banner" role="alert" aria-live="polite" hidden>
    ⚠️ Chart is currently unavailable. All other features remain functional.
  </div>

  <main class="app-container">

    <!-- ── Balance Display ── -->
    <header class="balance-section">
      <h1 class="balance-label">Total Balance</h1>
      <p id="balance" aria-live="polite">$0.00</p>
    </header>

    <!-- ── Transaction Form ── -->
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add Expense</h2>

      <form id="transaction-form" novalidate>

        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            name="item-name"
            maxlength="100"
            placeholder="e.g. Coffee"
            autocomplete="off"
          />
          <span class="error-msg" id="name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="amount">Amount ($)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            max="999999999.99"
            step="0.01"
            placeholder="0.00"
          />
          <span class="error-msg" id="amount-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error-msg" id="category-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" id="add-btn">Add Transaction</button>

      </form>
    </section>

    <div class="panels">

      <!-- ── Transaction List ── -->
      <section class="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list">
          <!-- Transactions are injected here by Renderer.renderList() -->
        </ul>
        <p id="empty-msg">No transactions added yet.</p>
      </section>

      <!-- ── Spending Chart ── -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div id="chart-container">
          <canvas id="chart-canvas" aria-label="Spending distribution pie chart" role="img"></canvas>
          <p id="chart-placeholder">No spending data available.</p>
        </div>
      </section>

    </div><!-- /.panels -->

  </main><!-- /.app-container -->

  <script src="js/app.js" defer></script>
</body>
</html>
